name: FF Tournament Build

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate platforms
        run: flutter create --platforms=android,web .

      - name: Get packages
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Build APK
        run: flutter build apk --release

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: ff-tournament-builds
          path: |
            build/web/
            build/app/outputs/flutter-apk/app-release.apkbasic workflow to help you get started with Actions
