name: FF Tournament Build

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Configure Android and Web
        run: flutter create --project-name=ff_tournament --platforms=android,web .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web App
        run: flutter build web --release

      - name: Build Android APK
        run: flutter build apk --release

      - name: Save build files
        uses: actions/upload-artifact@v4
        with:
          name: ff-tournament-builds
          path: |
            build/web/
            build/app/outputs/flutter-apk/app-release.apk
